}

  const layerMetadata = {

  function updateLegend(selectedLayer) {
    const legendPanel = document.getElementById("legendPanel");
    const legendTitle = document.getElementById("legendTitle");
    const legendImage = document.getElementById("legendImage");
    const legendDescription = document.getElementById("legendDescription");
    const meta = layerMetadata[selectedLayer];

    if (!meta || !meta.legendUrl) {
      legendPanel.style.display = "none";
      legendImage.removeAttribute("src");
      return;
    }

    legendTitle.textContent = meta.title;
    legendImage.src = meta.legendUrl + "&_ts=" + Date.now();
    legendDescription.textContent = meta.description || "";
    legendPanel.style.display = "block";
  }


  document.getElementById('wmsSelect')
    .addEventListener('change', function(event) {

        if (currentLayer) {
            layers.remove(currentLayer);
            currentLayer = null;
        }

        if (selectedPolygonLayer) {
            layers.remove(selectedPolygonLayer);
            selectedPolygonLayer = null;
        }

        const selectedLayer = event.target.value;

        currentLayerKey = selectedLayer;

        updateLegend(selectedLayer);

        if (
            selectedLayer !== 'none' &&
            wmsLayers[selectedLayer]
        ) {

            currentLayer =
                layers.addImageryProvider(
                    wmsLayers[selectedLayer]
                );

            if (selectedLayer === "osm_labels") {
                currentLayer.alpha = 0.55;
            } else {
                currentLayer.alpha = 0.85;
            }
        }
    });






let selectedPolygonLayer = null;

const clickHandler =
    new Cesium.ScreenSpaceEventHandler(
        viewer.scene.canvas
    );

clickHandler.setInputAction(
    async function(click) {

        // La selezione funziona solo
        // sulle statistiche zonali
        if (
            currentLayerKey !==
            'StatistichezonaliDT_Lecce_14082024'
        ) {
            return;
        }

        try {

            // Crea il raggio dalla posizione del mouse
            const ray =
                viewer.camera.getPickRay(
                    click.position
                );

            if (!ray) {
                return;
            }

            // GetFeatureInfo sul WMS
            const features =
                await viewer.imageryLayers
                    .pickImageryLayerFeatures(
                        ray,
                        viewer.scene
                    );

            if (
                !features ||
                features.length === 0
            ) {

                console.log(
                    "Nessuna feature trovata"
                );

                return;
            }

            console.log(
                "Features:",
                features
            );

            const feature =
                features[0];

            console.log(
                "Feature selezionata:",
                feature
            );

            console.log(
                "Attributi:",
                feature.properties
            );

            const polygonId =
                feature.properties.fid;

            console.log(
                "FID:",
                polygonId
            );

            if (
                polygonId === undefined ||
                polygonId === null
            ) {

                console.warn(
                    "Attributo fid non trovato"
                );

                return;
            }

            // Rimuove evidenziazione precedente
            if (selectedPolygonLayer) {

                layers.remove(
                    selectedPolygonLayer
                );

                selectedPolygonLayer = null;
            }

            // Nuovo WMS contenente
            // esclusivamente il poligono cliccato
            const selectedProvider =
                new Cesium.WebMapServiceImageryProvider({

                    url:
                    'http://localhost:8087/geoserver/wms',

                    layers:
                    'eo4des:StatistichezonaliDT_Lecce_14082024',

                    parameters: {

                        transparent: 'true',

                        format: 'image/png',

                        styles:
                        'selected_polygon',

                        CQL_FILTER:
                        'fid=' + polygonId
                    },

                    enablePickFeatures: false
                });

            selectedPolygonLayer =
                layers.addImageryProvider(
                    selectedProvider
                );

            selectedPolygonLayer.alpha =
                1.0;

        }

        catch (error) {

            console.error(
                "Error selecting polygon:",
                error
            );

        }

    },

    Cesium.ScreenSpaceEventType.LEFT_CLICK
);
